<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0071D4">
<title>Utarget Tarefas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#0071D4; --azul-esc:#005BAA; --laranja:#FF9100; --grafite:#404040;
  --bg:#F4F6F9; --card:#FFFFFF; --txt:#1F2328; --sub:#5F6670; --linha:#E2E6EC;
  --verm:#C62828; --verm-bg:#FDECEC; --amar-bg:#FFF4E0; --verde:#1B7F3A; --verde-bg:#E7F5EC;
  --sombra:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#111418; --card:#1A1F25; --txt:#E8EAED; --sub:#9AA3AD; --linha:#2A313A;
    --verm:#FF6B6B; --verm-bg:#3A1C1C; --amar-bg:#3A2C12; --verde:#5FD38A; --verde-bg:#16301F;
    --sombra:none;
  }
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:Montserrat,system-ui,sans-serif;font-size:15px;-webkit-font-smoothing:antialiased}
button{font-family:inherit;font-size:inherit;cursor:pointer}
header{position:sticky;top:0;z-index:5;background:var(--azul);color:#fff;padding:calc(env(safe-area-inset-top) + 12px) 16px 0}
.topo{display:flex;align-items:center;justify-content:space-between;gap:12px}
.marca{font-weight:700;font-size:17px;letter-spacing:.2px}
.marca small{display:block;font-weight:500;font-size:12px;opacity:.85}
.sair{background:transparent;border:1px solid rgba(255,255,255,.5);color:#fff;border-radius:8px;padding:6px 10px;font-size:13px}
nav.abas{display:flex;gap:4px;margin-top:12px;overflow-x:auto}
nav.abas button{flex:0 0 auto;background:transparent;border:0;color:rgba(255,255,255,.8);padding:10px 12px;border-bottom:3px solid transparent;font-weight:600}
nav.abas button[aria-selected="true"]{color:#fff;border-bottom-color:#fff}
main{max-width:720px;margin:0 auto;padding:12px 16px calc(env(safe-area-inset-bottom) + 32px)}
.resumo{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:4px 0 14px}
.kpi{background:var(--card);border-radius:12px;padding:10px 8px;text-align:center;box-shadow:var(--sombra)}
.kpi b{display:block;font-size:22px;line-height:1.1}
.kpi span{font-size:11px;color:var(--sub)}
.kpi.alerta b{color:var(--verm)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--sub);margin:18px 2px 8px;font-weight:700}
.card{display:block;width:100%;text-align:left;background:var(--card);border:0;border-radius:12px;padding:12px 14px;margin-bottom:8px;box-shadow:var(--sombra);color:var(--txt);border-left:4px solid transparent}
.card.atrasada{border-left-color:var(--verm)}
.card.hoje{border-left-color:var(--laranja)}
.card .l1{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.card .tit{font-weight:600;line-height:1.3}
.card .data{flex:0 0 auto;font-weight:700;font-size:13px;white-space:nowrap}
.card .data.atrasada{color:var(--verm)}
.card .l2{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;font-size:12px;color:var(--sub);align-items:center}
.tag{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:600;background:var(--linha);color:var(--txt)}
.tag.multa{background:var(--laranja);color:#2B1A00}
.tag.status{background:var(--verde-bg);color:var(--verde)}
.tag.aguard{background:var(--amar-bg);color:var(--txt)}
.vazio{text-align:center;color:var(--sub);padding:40px 12px}
.barra{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px}
.barra select,.barra button{background:var(--card);color:var(--txt);border:1px solid var(--linha);border-radius:8px;padding:8px 10px}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
.login .caixa{background:var(--card);border-radius:16px;padding:28px 22px;max-width:380px;width:100%;box-shadow:var(--sombra);text-align:center}
.login h1{color:var(--azul);font-size:22px;margin:0 0 4px}
.login p{color:var(--sub);margin:0 0 20px;font-size:14px}
.btn{display:block;width:100%;border:0;border-radius:10px;padding:13px 14px;font-weight:600;margin-top:10px}
.btn.prim{background:var(--azul);color:#fff}
.btn.sec{background:transparent;color:var(--azul);border:1px solid var(--azul)}
.btn.perigo{background:transparent;color:var(--verm);border:1px solid var(--verm)}
input,textarea,select{font-family:inherit;font-size:15px;width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--linha);background:var(--card);color:var(--txt)}
.ou{margin:18px 0 6px;color:var(--sub);font-size:12px}
.msg{font-size:13px;color:var(--sub);margin-top:12px}
.fundo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:10;display:flex;align-items:flex-end;justify-content:center}
.folha{background:var(--card);width:100%;max-width:720px;border-radius:18px 18px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);max-height:88vh;overflow:auto}
.folha h3{margin:0 0 4px;font-size:18px}
.folha .cli{color:var(--sub);font-size:13px;margin-bottom:12px}
.datas{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.datas div{background:var(--bg);border-radius:10px;padding:8px;text-align:center}
.datas span{display:block;font-size:11px;color:var(--sub)}
.datas b{font-size:14px}
.acoes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.acoes .btn{margin-top:0}
.form{margin-top:12px;display:grid;gap:8px}
.form label{font-size:12px;color:var(--sub);text-align:left}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 18px);transform:translateX(-50%);background:var(--grafite);color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;z-index:20}
@media (max-width:380px){.resumo{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<script src="supabase.min.js"></script>
<script src="app.js"></script>
</body>
</html>
